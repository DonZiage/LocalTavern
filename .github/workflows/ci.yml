# LocalTavern CI
#
# Runs on every push to `dev` and on pull requests targeting `dev`.
#
# Jobs:
#   test    — shared + desktop tests (`:composeApp:desktopTest`, incl. the
#              commonTest suite) on Ubuntu, under Xvfb (Compose desktop UI
#              tests need a display). Also packages the Linux desktop app
#              as a smoke test of `packageDistributionForCurrentOS`.
#   android — builds the debug APK (`:composeApp:assembleDebug`, AGP 8.13.2,
#              compileSdk 36) on Ubuntu and uploads it as an artifact.
#   ios     — links the iOS simulator framework
#              (`:composeApp:linkDebugFrameworkIosSimulatorArm64`) on macOS.
#              This is the Kotlin/Native part of the iOS target, as in the
#              README. It does NOT build the Xcode host app (`iosApp/` has
#              no shared scheme and uses automatic code signing, which needs
#              an Apple Developer identity that CI does not have).
#
# Toolchain: JDK 17 (project uses `jvmToolchain(17)`), Gradle 8.14.3 via
# the wrapper. No signing keys or secrets are needed: Android builds the
# debug APK only, and no release artifacts are produced.
#
# Cost: LocalTavern is a public repo, so GitHub Actions minutes on these
# standard runners (ubuntu-latest, macos-latest) are free and unmetered —
# that is what keeps this workflow at $0, not the settings below. The
# only thing GitHub meters on a free account is storage: artifacts and
# Packages share a 500 MB free allowance ($0.25/GB-month over it) and the
# Actions cache allows 10 GB per repo. So this workflow keeps costs at
# zero by: only standard runners, no duplicate runs (concurrency cancels
# an older run on a new push), no runs at all for docs-only changes
# (paths-ignore below), short artifact retention (3 days), and job
# timeouts so a hung job cannot sit on a runner indefinitely.

name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  pull_request:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Desktop tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run desktop tests
        # Compose desktop UI tests need a display on Linux.
        run: xvfb-run -a ./gradlew :composeApp:desktopTest --stacktrace

      - name: Package Linux desktop app (smoke test)
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: |
            composeApp/build/test-results/desktopTest/
            composeApp/build/reports/tests/desktopTest/
          retention-days: 3

      - name: Upload Linux desktop package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: localtavern-linux-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: warn
          retention-days: 3

  android:
    name: Android debug APK (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (compileSdk 36)
        uses: android-actions/setup-android@v3
        with:
          # setup-android's only package input is `packages` — `api-level`
          # and `build-tools` are not valid inputs and are ignored. Its
          # default packages are `tools platform-tools`, and the obsolete
          # `tools` package no longer exists, so list the packages the
          # project actually needs. Do not pin cmdline-tools-version:
          # the runner's preinstalled 20.0 works, and requesting 16 makes
          # the action try to download a command-line-tools zip that 404s.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: localtavern-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS simulator framework (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Link iOS simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
