name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  desktop-android:
    name: Desktop tests + Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Desktop tests
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Android build
        run: ./gradlew :composeApp:assembleDebug --no-daemon

  ios:
    name: iOS framework compile
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
